[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skyllm*"]

[project]
name = "skyllm"
version = "0.1.0"
description = "Autonomous Vision-Language-Action (VLA) UAV Flight Control System with PX4 SITL & Gazebo."
authors = [{ name = "SrihasRC", email = "challasrihasreddy@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "overrides",
    "flask",
    "uvicorn",
    "quart",
    "grpcio-tools",
    "aiohttp",
    "openai",
    "opencv-python",
    "numpy",
    "pillow",
    "djitellopy",
    "filterpy",
    "python-dotenv",
    "ultralytics",
    "torch",
]

[project.scripts]
skyllm-run = "skyllm.launcher:main"
skyllm-serving = "skyllm.serving.run:main"
skyllm-webui = "skyllm.webui:main"
fly-run = "skyllm.launcher:main"
typefly-run = "skyllm.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:launch_ros -p no:launch_testing"